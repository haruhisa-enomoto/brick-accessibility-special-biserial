name = "brick_accessibility"
version = "0.1.0"
defaultTargets = ["BrickAccessibility"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "BrickAccessibility"
globs = ["BrickAccessibility", "BrickAccessibility.*"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
weakLeanArgs = ["-j1", "-M14000"]

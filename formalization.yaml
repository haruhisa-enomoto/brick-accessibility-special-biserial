      note: "Proved in Solution.lean from BrickAccessibility.theoremA."
    - source: "Brick accessibility for brick-finite special biserial algebras, Corollary B (Corollary 5.5)"
      lean: "BrickAccessibility.Challenge.corollaryB"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution.lean from BrickAccessibility.corollaryB."
    - source: "Brick accessibility for brick-finite special biserial algebras, Corollary 5.6"
      lean: "BrickAccessibility.Challenge.corollaryBiserial"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution.lean from BrickAccessibility.corollaryBiserial."

